name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Tạo icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111316'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: kho-tranh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
